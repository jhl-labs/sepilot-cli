version: 1
device:
  id: "auto-generated-on-init"
  name: "my-machine"
  role: "desktop"
daemon:
  port: 17600
  host: "127.0.0.1"
gateway:
  url: "http://127.0.0.1:17610"
providers:
  - id: "ollama"
    type: "ollama"
    baseUrl: "http://localhost:11434"
    models: [ "llama3.3", "qwen3" ]
    default: true
agent:
  autonomy: "supervised"
  thinkingLevel: "medium"
channels: []
channelPipeline:
  defaultWorkspaceRoot: "~/workspace"
mcp:
  servers: []
  client:
    roots:
      enabled: false
      listChanged: true
      entries: []
    sampling:
      enabled: false
      maxTokens: 1024
    elicitation:
      enabled: false
      mode: "decline"
      applyDefaults: true
memory:
  encryption: true
  vectorBackend: "auto"
security:
  toolPolicy: "policies.yaml"
  auditLog: true
  sandbox: "local"
  sandboxHostFileTools: "deny"
observability:
  telemetry: false
