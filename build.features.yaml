version: 1
features:
  browser: true
  computer-use: true
  micro-apps: true
  channels:
    telegram: true
    slack: true
    discord: true
    mattermost: true
    teams: true
    line: true
    whatsapp: true
    webchat: true
    webhook: true
    github-issue: true
  voice: true
  swarm: true
  pages: true
  image-gen: true
  market: true
  media: true
  office: true
  mcp: true
  delegation: true
  extensions: true
  a2a: true
  acp: true
  notebook: true
  lsp: true
  wiki: true
  plugins: true
  # Desktop compile-time availability. `modes` controls the renderer catalog;
  # `settings` also controls matching Electron IPC/background startup.
  # Daemon routes and graphs are not removed from the standalone binary.
  desktop:
    modes:
      coding: true
      computer-use: true
    settings:
      google: true
      smart-home: false
      github-oauth: false
      github-sync: false
      # Team Docs uses its own repository PAT/GHES connection and does not
      # depend on GitHub OAuth or GitHub Sync.
      team-docs: true
      # Gates both halves of the snippet surface: the settings tab and the
      # sidebar gallery view. Leaving one of the two ungated is what let
      # Snippets stay reachable while it was meant to be off.
      snippets: false
      # Top-level workspaces in the sidebar. Previously these followed the
      # `minimal` feature-profile env var alone, so the manifest could not
      # turn them off. `canvas` also covers the Gallery view.
      shell: false
      apps: true
      canvas: false
    apps:
      enabled-template-ids:
        - calendar
        - todo
        - briefing
        - sticky
        - vault
        - kanban
      default-open-template-ids:
        - calendar
        - todo
        - briefing
        - sticky
        - vault
        - kanban
  # locked (always included; setting false fails the build):
  # memory, scheduler, skills
